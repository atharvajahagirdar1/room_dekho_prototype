<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        .sidebar-link.active {
            background-color: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }
         .sidebar-link.active i {
            color: #4338ca;
        }
    </style>
</head>
<body class="flex h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md flex flex-col flex-shrink-0">
        <div class="h-20 flex items-center justify-center border-b">
            <h1 class="text-2xl font-bold text-indigo-600">RoomDekho</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="sidebar-link active flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-tachometer-alt w-6 h-6 mr-3 text-gray-500"></i> Dashboard
            </a>
            <a href="#my-listings" class="sidebar-link flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-list w-6 h-6 mr-3 text-gray-500"></i> My Listings
            </a>
            <a href="#booking-requests" class="sidebar-link flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-calendar-check w-6 h-6 mr-3 text-gray-500"></i> Bookings
            </a>
            <a href="#analytics" class="sidebar-link flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-chart-line w-6 h-6 mr-3 text-gray-500"></i> Analytics
            </a>
             <a href="#" class="sidebar-link flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-wallet w-6 h-6 mr-3 text-gray-500"></i> Payments
            </a>
            <a href="#" class="sidebar-link flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-cog w-6 h-6 mr-3 text-gray-500"></i> Settings
            </a>
        </nav>
        <div class="px-4 py-6 border-t">
            <button id="logoutBtn" class="w-full flex items-center px-4 py-2 text-gray-700 rounded-md hover:bg-gray-100">
                <i class="fas fa-sign-out-alt w-6 h-6 mr-3 text-gray-500"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="px-8 h-20 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-800">Dashboard Overview</h2>
                <div class="relative">
                    <div id="userMenuBtn" class="flex items-center space-x-3 cursor-pointer">
                        <span id="userName" class="font-semibold text-gray-700">Owner</span>
                        <img id="userAvatar" class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/E2E8F0/4A5568?text=O" alt="User Avatar">
                    </div>
                     <div id="userMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 hidden">
                         <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Your Profile</a>
                     </div>
                </div>
            </div>
        </header>
        
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-8">
            <!-- Dashboard Overview -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="stats-grid">
                <!-- Stat Cards Loaded Here -->
            </div>

            <!-- Booking Trends & Revenue -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow">
                    <h3 class="font-semibold">Booking Trends</h3>
                    <canvas id="bookingTrendsChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="font-semibold">Revenue Overview</h3>
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            
            <!-- My Listings -->
            <section id="my-listings" class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold">My Listings</h3>
                    <button id="addPropertyBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 text-sm">Add New Property</button>
                </div>
                <div id="listingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Listings Loaded Here -->
                </div>
            </section>
            
             <!-- Booking Requests -->
            <section id="booking-requests" class="mb-8">
                <h3 class="text-xl font-semibold mb-4">Booking Requests</h3>
                <div id="bookingsList" class="space-y-4 bg-white p-6 rounded-lg shadow">
                    <!-- Bookings Loaded Here -->
                </div>
            </section>
            
             <!-- Reviews & Feedback -->
            <section id="reviews" class="mb-8">
                <h3 class="text-xl font-semibold mb-4">Reviews & Feedback</h3>
                <div class="bg-white p-6 rounded-lg shadow">
                    <div id="reviewsList" class="space-y-4">
                        <!-- Reviews Loaded Here -->
                    </div>
                </div>
            </section>
            
             <!-- Analytics -->
            <section id="analytics" class="mb-8">
                <h3 class="text-xl font-semibold mb-4">Analytics & Insights</h3>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                     <div class="bg-white p-6 rounded-lg shadow">
                         <h4 class="font-medium">Occupancy Rate</h4>
                          <canvas id="occupancyChart"></canvas>
                     </div>
                     <div class="bg-white p-6 rounded-lg shadow">
                         <h4 class="font-medium">Monthly Reviews</h4>
                         <canvas id="reviewsChart"></canvas>
                     </div>
                 </div>
            </section>

        </main>
    </div>
    
    <!-- Add/Edit Property Modal -->
    <div id="propertyModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50 hidden">
        <div class="bg-white w-full max-w-2xl rounded-lg shadow-xl">
            <form id="propertyForm">
                <div class="flex items-center justify-between p-6 border-b">
                    <h3 id="propertyModalTitle" class="text-2xl font-bold">Add New Property</h3>
                    <button type="button" id="closePropertyModalBtn" class="p-2 rounded-full hover:bg-gray-100">&times;</button>
                </div>
                <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                    <input type="hidden" id="propertyId">
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" id="title" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                    <div>
                        <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                        <input type="text" id="location" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                     <div>
                        <label for="price" class="block text-sm font-medium text-gray-700">Price (per month)</label>
                        <input type="number" id="price" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                    <div>
                        <label for="imageUrl" class="block text-sm font-medium text-gray-700">Image URL</label>
                        <input type="url" id="imageUrl" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                     <div>
                        <label for="tags" class="block text-sm font-medium text-gray-700">Tags (comma-separated, e.g., 1BHK, Furnished)</label>
                        <input type="text" id="tags" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                </div>
                <div class="flex items-center justify-end p-6 border-t space-x-2">
                    <button type="button" id="cancelPropertyModalBtn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md">Cancel</button>
                    <button type="submit" id="savePropertyBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-md">Save Property</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const App = {
            currentUser: null,
            userData: {},
            isEditing: false,
            
            init() {
                this.bindEvents();
                onAuthStateChanged(auth, this.handleAuth.bind(this));
            },

            async handleAuth(user) {
                if (user) {
                    this.currentUser = user;
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().userType === 'owner') {
                        this.userData = userDoc.data();
                        this.renderUserInfo();
                        this.loadDashboard();
                    } else { window.location.href = 'renter-dashboard.html'; }
                } else { window.location.href = 'login.html'; }
            },

            renderUserInfo() {
                document.getElementById('userName').textContent = this.userData.username || this.currentUser.email;
                if (this.userData.username) {
                    document.getElementById('userAvatar').src = `https://placehold.co/40x40/E2E8F0/4A5568?text=${this.userData.username.charAt(0).toUpperCase()}`;
                }
            },
            
            bindEvents() {
                 document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
                 document.getElementById('userMenuBtn').addEventListener('click', () => document.getElementById('userMenu').classList.toggle('hidden'));
                 document.getElementById('addPropertyBtn').addEventListener('click', () => this.openPropertyModal());
                 document.getElementById('closePropertyModalBtn').addEventListener('click', () => this.closePropertyModal());
                 document.getElementById('cancelPropertyModalBtn').addEventListener('click', () => this.closePropertyModal());
                 document.getElementById('propertyForm').addEventListener('submit', this.handlePropertySave.bind(this));
                 document.getElementById('listingsGrid').addEventListener('click', this.handleListingAction.bind(this));
            },

            async loadDashboard() {
                // Using mock data for now, but wired to be replaced by Firestore calls
                this.loadStats(mockData.listings, mockData.bookings, mockData.stats.totalUsers);
                this.loadListings(mockData.listings);
                this.loadBookings(mockData.bookings);
                this.loadReviews(mockData.reviews);
                this.renderCharts();
            },
            
            loadStats(listings, bookings, totalUsers) {
                document.getElementById('stats-grid').innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Total Listings</h3><p class="text-3xl font-bold mt-1">${listings.length}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Total Renters</h3><p class="text-3xl font-bold mt-1">${totalUsers}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Active Bookings</h3><p class="text-3xl font-bold mt-1">${bookings.filter(b => b.status === 'accepted').length}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Pending Requests</h3><p class="text-3xl font-bold mt-1">${bookings.filter(b => b.status === 'pending').length}</p></div>
                `;
            },
            
            loadListings(listings) {
                const grid = document.getElementById('listingsGrid');
                grid.innerHTML = '';
                if (listings.length === 0) {
                    grid.innerHTML = '<p class="text-gray-500">No listings found.</p>';
                    return;
                }
                listings.forEach(room => grid.innerHTML += this.createListingCard(room));
            },
            
            loadBookings(bookings) {
                const list = document.getElementById('bookingsList');
                list.innerHTML = '';
                 if (bookings.length === 0) {
                    list.innerHTML = '<p class="text-gray-500">No booking requests found.</p>';
                    return;
                }
                bookings.forEach(b => list.innerHTML += this.createBookingRow(b));
            },
            
            loadReviews(reviews){
                 const list = document.getElementById('reviewsList');
                 list.innerHTML = '';
                 if(reviews.length === 0){
                     list.innerHTML = '<p class="text-gray-500">No reviews yet.</p>';
                     return;
                 }
                 reviews.forEach(r => list.innerHTML += this.createReviewCard(r));
            },

            createListingCard(room) {
                 return `<div class="bg-white rounded-lg shadow p-4 flex flex-col">
                            <img src="${room.imageUrl}" class="w-full h-32 object-cover rounded-md mb-4">
                            <h4 class="font-semibold">${room.title}</h4>
                            <p class="text-sm text-gray-500">${room.location}</p>
                            <p class="mt-2 font-bold text-lg">₹${room.price}/month</p>
                            <div class="mt-auto pt-4 flex space-x-2">
                                <button class="edit-btn text-sm w-full py-2 bg-yellow-400 text-yellow-900 rounded font-semibold" data-id="${room.id}">Edit</button>
                                <button class="delete-btn text-sm w-full py-2 bg-red-500 text-white rounded font-semibold" data-id="${room.id}">Delete</button>
                            </div>
                        </div>`;
            },
            
            createBookingRow(booking) {
                 const statusStyles = {
                    pending: 'bg-yellow-100 text-yellow-800',
                    accepted: 'bg-green-100 text-green-800',
                    declined: 'bg-red-100 text-red-800',
                };
                return `<div class="flex items-center justify-between py-2 border-b">
                            <div>
                                <p class="font-medium">${booking.renterName} for ${booking.roomTitle}</p>
                                <p class="text-sm text-gray-500">${new Date(booking.createdAt.toDate()).toLocaleDateString()}</p>
                            </div>
                             <span class="capitalize text-xs font-semibold px-2 py-1 rounded-full ${statusStyles[booking.status]}">${booking.status}</span>
                        </div>`;
            },
            
            createReviewCard(review) {
                 return `<div class="border-t py-4">
                    <div class="flex items-center mb-2">
                        <div class="flex text-yellow-400">${[...Array(5)].map((_, i) => `<i class="fas fa-star ${i < review.rating ? '' : 'text-gray-300'}"></i>`).join('')}</div>
                        <p class="ml-auto text-sm text-gray-500">by ${review.renterName}</p>
                    </div>
                    <p class="text-gray-600 text-sm">${review.comment}</p>
                </div>`;
            },
            
            renderCharts() {
                // ... (chart rendering logic remains the same)
                 const bookingCtx = document.getElementById('bookingTrendsChart').getContext('2d');
                new Chart(bookingCtx, { type: 'line', data: { labels: ['Jan', 'Feb', 'Mar', 'Apr'], datasets: [{ label: 'Bookings', data: [12, 19, 3, 5], borderColor: '#4F46E5' }] } });
                const revenueCtx = document.getElementById('revenueChart').getContext('2d');
                new Chart(revenueCtx, { type: 'doughnut', data: { labels: ['Online', 'Cash'], datasets: [{ data: [300, 150], backgroundColor: ['#4F46E5', '#D1D5DB'] }] } });
                const occupancyCtx = document.getElementById('occupancyChart').getContext('2d');
                new Chart(occupancyCtx, { type: 'bar', data: { labels: ['Property A', 'Property B'], datasets: [{ label: 'Occupancy %', data: [80, 65], backgroundColor: '#4F46E5' }] } });
                const reviewsCtx = document.getElementById('reviewsChart').getContext('2d');
                new Chart(reviewsCtx, { type: 'radar', data: { labels: ['Jan', 'Feb', 'Mar'], datasets: [{ label: 'Reviews', data: [5, 9, 7], borderColor: '#4F46E5' }] } });
            },

            // --- Modal & Form Logic ---
            openPropertyModal(isEditing = false, room = {}) {
                this.isEditing = isEditing;
                document.getElementById('propertyForm').reset();
                document.getElementById('propertyModalTitle').textContent = isEditing ? 'Edit Property' : 'Add New Property';
                document.getElementById('propertyId').value = room.id || '';
                document.getElementById('title').value = room.title || '';
                document.getElementById('location').value = room.location || '';
                document.getElementById('price').value = room.price || '';
                document.getElementById('imageUrl').value = room.imageUrl || '';
                document.getElementById('tags').value = (room.tags || []).join(', ');
                document.getElementById('propertyModal').classList.remove('hidden');
            },

            closePropertyModal() {
                 document.getElementById('propertyModal').classList.add('hidden');
            },
            
            async handlePropertySave(e) {
                e.preventDefault();
                const form = e.target;
                const propertyData = {
                    title: form.querySelector('#title').value,
                    location: form.querySelector('#location').value,
                    price: parseFloat(form.querySelector('#price').value),
                    imageUrl: form.querySelector('#imageUrl').value,
                    tags: form.querySelector('#tags').value.split(',').map(tag => tag.trim()).filter(Boolean),
                    ownerId: this.currentUser.uid,
                    ownerName: this.userData.username,
                    status: 'Available',
                };

                const saveBtn = document.getElementById('savePropertyBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    if (this.isEditing) {
                        const propertyId = form.querySelector('#propertyId').value;
                        await updateDoc(doc(db, "rooms", propertyId), propertyData);
                    } else {
                        await addDoc(collection(db, "rooms"), { ...propertyData, createdAt: serverTimestamp() });
                    }
                    this.closePropertyModal();
                    await this.loadListings(); // Refresh listings
                } catch (error) {
                    console.error("Error saving property:", error);
                    alert("Failed to save property.");
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Property';
                }
            },
            
            async handleListingAction(e){
                const target = e.target;
                 const id = target.dataset.id;
                if(!id) return;
                
                if(target.classList.contains('edit-btn')) {
                    // Fetch real data to edit
                    const roomDoc = await getDoc(doc(db, "rooms", id));
                    if(roomDoc.exists()) this.openPropertyModal(true, {id: roomDoc.id, ...roomDoc.data()});
                }
                 if(target.classList.contains('delete-btn')) {
                    if(confirm('Are you sure you want to delete this listing?')){
                         await deleteDoc(doc(db, "rooms", id));
                         await this.loadListings();
                    }
                }
            }
        };

        App.init();

    </script>
</body>
</html>
