<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
        }
        .star-rating i {
            color: #d1d5db; /* gray-300 */
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating:hover i,
        .star-rating i.hover {
            color: #f59e0b; /* amber-500 */
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-8">
                    <a href="renter-dashboard.html" class="text-2xl font-bold text-gray-900">RoomDekho</a>
                     <nav class="hidden md:flex items-center space-x-6 text-gray-600 font-medium">
                        <a href="renter-dashboard.html" class="hover:text-indigo-600 transition-colors">Browse Rooms</a>
                        <a href="#" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">My Bookings</a>
                    </nav>
                </div>
                <div class="flex items-center space-x-4">
                     <div class="relative">
                        <div id="userMenuBtn" class="flex items-center space-x-2 cursor-pointer">
                            <img id="userAvatar" class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/E2E8F0/4A5568?text=U" alt="User Avatar">
                            <span id="userName" class="hidden md:block font-semibold text-gray-700">User</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-500"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                         <div id="userMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu">
                             <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Your Profile</a>
                             <button id="logoutBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Logout</button>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 lg:px-8 py-8">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-8">My Booking Requests</h1>
        
        <div id="bookingsList" class="space-y-4">
            <p id="loader" class="text-center text-gray-500">Loading your bookings...</p>
            <!-- Booking Cards will be injected here -->
        </div>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop bg-black bg-opacity-50 hidden">
        <div class="bg-white w-full max-w-lg rounded-lg shadow-xl">
            <div class="p-6">
                <h3 class="text-xl font-bold text-gray-900 mb-4">Leave a Review</h3>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Your Rating</label>
                    <div id="starRating" class="star-rating flex space-x-1 text-3xl">
                        <i class="fas fa-star" data-value="1"></i>
                        <i class="fas fa-star" data-value="2"></i>
                        <i class="fas fa-star" data-value="3"></i>
                        <i class="fas fa-star" data-value="4"></i>
                        <i class="fas fa-star" data-value="5"></i>
                    </div>
                </div>
                <div>
                    <label for="reviewComment" class="block text-sm font-medium text-gray-700">Your Review</label>
                    <textarea id="reviewComment" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="Share your experience..."></textarea>
                </div>
                <div class="mt-6 flex justify-end gap-4">
                    <button id="cancelReviewBtn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md font-semibold hover:bg-gray-300">Cancel</button>
                    <button id="submitReviewBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-md font-semibold hover:bg-indigo-700">Submit Review</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- App State ---
        let currentUser = null;
        let reviewedBookingIds = [];
        let currentRating = 0;
        let bookingToReview = null;

        // --- UI Elements ---
        const ui = {
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            logoutBtn: document.getElementById('logoutBtn'),
            userMenuBtn: document.getElementById('userMenuBtn'),
            userMenu: document.getElementById('userMenu'),
            bookingsList: document.getElementById('bookingsList'),
            loader: document.getElementById('loader'),
            reviewModal: document.getElementById('reviewModal'),
            starRating: document.getElementById('starRating'),
            reviewComment: document.getElementById('reviewComment'),
            cancelReviewBtn: document.getElementById('cancelReviewBtn'),
            submitReviewBtn: document.getElementById('submitReviewBtn'),
        };

        // --- Authentication ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    renderUserInfo(userDoc.data());
                    await fetchReviewedBookings();
                    await fetchAndRenderBookings();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function renderUserInfo(userData) {
            ui.userName.textContent = userData.username || currentUser.email;
            if (userData.username) {
                ui.userAvatar.src = `https://placehold.co/40x40/E2E8F0/4A5568?text=${userData.username.charAt(0).toUpperCase()}`;
            }
        }
        
        async function fetchReviewedBookings() {
             const q = query(collection(db, "reviews"), where("renterId", "==", currentUser.uid));
             const snapshot = await getDocs(q);
             reviewedBookingIds = snapshot.docs.map(doc => doc.data().bookingId);
        }

        async function fetchAndRenderBookings() {
            try {
                const q = query(collection(db, "bookings"), where("renterId", "==", currentUser.uid));
                const snapshot = await getDocs(q);
                const bookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                ui.loader.style.display = 'none';
                ui.bookingsList.innerHTML = '';

                if (bookings.length === 0) {
                    ui.bookingsList.innerHTML = `<p class="text-center text-gray-500">You haven't made any booking requests yet.</p>`;
                    return;
                }
                
                bookings.sort((a,b) => b.createdAt.toMillis() - a.createdAt.toMillis());

                bookings.forEach(booking => {
                    ui.bookingsList.innerHTML += createBookingCardHTML(booking);
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
                ui.loader.textContent = "Could not load your bookings.";
            }
        }

        function createBookingCardHTML(booking) {
            const statusClasses = {
                pending: 'bg-yellow-100 text-yellow-800',
                accepted: 'bg-green-100 text-green-800',
                declined: 'bg-red-100 text-red-800',
            };

            let reviewButton = '';
            if (booking.status === 'accepted' && !reviewedBookingIds.includes(booking.id)) {
                 reviewButton = `<button class="review-btn text-sm text-indigo-600 font-semibold hover:underline" data-booking-id="${booking.id}" data-room-id="${booking.roomId}" data-owner-id="${booking.ownerId}">Leave a Review</button>`;
            } else if (reviewedBookingIds.includes(booking.id)) {
                 reviewButton = `<p class="text-sm text-gray-500">Review Submitted</p>`;
            }

            return `
                <div class="bg-white p-4 rounded-lg shadow-md flex items-center justify-between">
                    <div>
                        <p class="font-bold text-lg">${booking.roomTitle || 'A Property'}</p>
                        <p class="text-sm text-gray-500">Requested on: ${new Date(booking.createdAt.toDate()).toLocaleDateString()}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-semibold capitalize px-3 py-1 rounded-full ${statusClasses[booking.status] || 'bg-gray-200'}">
                            ${booking.status}
                        </span>
                        ${reviewButton}
                    </div>
                </div>
            `;
        }

        // --- Modal & Review Logic ---
        function openReviewModal(bookingId, roomId, ownerId) {
            bookingToReview = { bookingId, roomId, ownerId };
            ui.reviewModal.classList.remove('hidden');
        }

        function closeReviewModal() {
            bookingToReview = null;
            currentRating = 0;
            ui.reviewComment.value = '';
            updateStars(0);
            ui.reviewModal.classList.add('hidden');
        }

        function updateStars(rating) {
            ui.starRating.querySelectorAll('i').forEach(star => {
                star.classList.toggle('text-yellow-400', star.dataset.value <= rating);
                star.classList.toggle('text-gray-300', star.dataset.value > rating);
            });
        }
        
        async function submitReview() {
            if (currentRating === 0) {
                alert("Please select a rating.");
                return;
            }
            ui.submitReviewBtn.disabled = true;
            ui.submitReviewBtn.textContent = "Submitting...";

            try {
                await addDoc(collection(db, "reviews"), {
                    ...bookingToReview,
                    renterId: currentUser.uid,
                    renterName: (await getDoc(doc(db, 'users', currentUser.uid))).data().username,
                    rating: currentRating,
                    comment: ui.reviewComment.value,
                    createdAt: serverTimestamp(),
                });
                alert("Review submitted successfully!");
                closeReviewModal();
                await fetchReviewedBookings();
                await fetchAndRenderBookings();
            } catch (error) {
                console.error("Error submitting review:", error);
                alert("Failed to submit review.");
            } finally {
                ui.submitReviewBtn.disabled = false;
                ui.submitReviewBtn.textContent = "Submit Review";
            }
        }

        // --- Event Listeners ---
        ui.logoutBtn.addEventListener('click', () => signOut(auth));
        ui.userMenuBtn.addEventListener('click', () => ui.userMenu.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (ui.userMenu && !ui.userMenu.contains(e.target) && !ui.userMenuBtn.contains(e.target)) {
                ui.userMenu.classList.add('hidden');
            }
        });
        
        ui.bookingsList.addEventListener('click', (e) => {
            if(e.target.classList.contains('review-btn')) {
                const { bookingId, roomId, ownerId } = e.target.dataset;
                openReviewModal(bookingId, roomId, ownerId);
            }
        });
        
        ui.cancelReviewBtn.addEventListener('click', closeReviewModal);
        ui.submitReviewBtn.addEventListener('click', submitReview);

        ui.starRating.addEventListener('click', (e) => {
            if(e.target.tagName === 'I') {
                currentRating = parseInt(e.target.dataset.value);
                updateStars(currentRating);
            }
        });

        ui.starRating.addEventListener('mouseover', (e) => {
            if(e.target.tagName === 'I') {
                const hoverValue = parseInt(e.target.dataset.value);
                updateStars(hoverValue);
            }
        });

        ui.starRating.addEventListener('mouseout', () => {
            updateStars(currentRating);
        });

    </script>
</body>
</html>
