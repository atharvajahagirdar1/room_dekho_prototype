<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100">

    <div id="admin-content" class="hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1>
                <button id="logout-btn" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <h2 class="text-xl font-semibold mb-4">Platform Overview</h2>
            <!-- Stat Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Total Users</h3>
                    <p id="total-users" class="text-3xl font-bold mt-1">0</p>
                </div>
                 <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Total Properties</h3>
                    <p id="total-properties" class="text-3xl font-bold mt-1">0</p>
                </div>
                 <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Active Bookings</h3>
                    <p id="active-bookings" class="text-3xl font-bold mt-1">0</p>
                </div>
                 <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Pending Requests</h3>
                    <p id="pending-requests" class="text-3xl font-bold mt-1">0</p>
                </div>
            </div>
            <!-- More sections for user management, etc., will go here -->
        </main>
    </div>
     <div id="loading-screen" class="flex items-center justify-center min-h-screen">
        <p class="text-gray-600">Verifying admin access...</p>
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where,getCountFromServer } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const adminContent = document.getElementById('admin-content');
        const loadingScreen = document.getElementById('loading-screen');
        const logoutBtn = document.getElementById('logout-btn');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    // User is an admin, show the dashboard
                    loadingScreen.style.display = 'none';
                    adminContent.classList.remove('hidden');
                    loadDashboardStats();
                } else {
                    // Not an admin, redirect
                    alert('Access Denied. Redirecting to homepage.');
                    window.location.href = '../index.html';
                }
            } else {
                // Not logged in, redirect
                window.location.href = 'admin-login.html';
            }
        });

        async function loadDashboardStats() {
            try {
                // Get total users
                const usersSnapshot = await getCountFromServer(collection(db, "users"));
                document.getElementById('total-users').textContent = usersSnapshot.data().count;

                // Get total properties
                const propertiesSnapshot = await getCountFromServer(collection(db, "rooms"));
                document.getElementById('total-properties').textContent = propertiesSnapshot.data().count;

                // Get booking stats
                const acceptedBookingsQuery = query(collection(db, "bookings"), where("status", "==", "accepted"));
                const acceptedSnapshot = await getCountFromServer(acceptedBookingsQuery);
                document.getElementById('active-bookings').textContent = acceptedSnapshot.data().count;

                const pendingBookingsQuery = query(collection(db, "bookings"), where("status", "==", "pending"));
                const pendingSnapshot = await getCountFromServer(pendingBookingsQuery);
                document.getElementById('pending-requests').textContent = pendingSnapshot.data().count;

            } catch (error) {
                console.error("Error loading stats:", error);
            }
        }
        
        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch(error => console.error('Logout error:', error));
        });
    </script>
</body>
</html>
