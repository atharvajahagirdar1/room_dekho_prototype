<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .score-circle {
            transform: rotate(-90deg);
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-2xl font-bold text-gray-900">RoomDekho</a>
                </div>
                 <div id="header-menu" class="flex items-center space-x-4">
                    <!-- Dynamic menu will be inserted here -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 lg:px-8 py-8">
        <div id="profile-container" class="max-w-4xl mx-auto">
            <p id="loader" class="text-center text-gray-500 py-20">Loading profile...</p>
            <!-- Profile content will be injected here -->
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ui = {
            headerMenu: document.getElementById('header-menu'),
            profileContainer: document.getElementById('profile-container'),
            loader: document.getElementById('loader'),
        };

        let currentLoggedInUser = null;

        onAuthStateChanged(auth, async (user) => {
            currentLoggedInUser = user;
            renderHeader(user);

            const profileUserId = new URLSearchParams(window.location.search).get('id');
            if (profileUserId) {
                await loadProfile(profileUserId);
            } else {
                ui.loader.textContent = "No profile specified.";
            }
        });

        function renderHeader(user) {
            if (user) {
                ui.headerMenu.innerHTML = `
                    <div class="relative">
                        <button id="userMenuBtn" class="flex items-center space-x-2">
                            <img id="userAvatar" class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/E2E8F0/4A5568?text=U" alt="User Avatar">
                        </button>
                        <div id="userMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 hidden">
                             <a id="dashboardLink" href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Dashboard</a>
                             <button id="logoutBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</button>
                         </div>
                    </div>`;
                
                document.getElementById('userMenuBtn').addEventListener('click', () => {
                    document.getElementById('userMenu').classList.toggle('hidden');
                });
                document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
                
                // Set dashboard link
                 getDoc(doc(db, "users", user.uid)).then(userDoc => {
                    if(userDoc.exists()){
                        const userData = userDoc.data();
                        document.getElementById('dashboardLink').href = userData.userType === 'owner' ? 'owner-dashboard.html' : 'renter-dashboard.html';
                        const userAvatar = document.getElementById('userAvatar');
                        if (userData.username) {
                            userAvatar.src = `https://placehold.co/40x40/E2E8F0/4A5568?text=${userData.username.charAt(0).toUpperCase()}`;
                        }
                    }
                });

            } else {
                ui.headerMenu.innerHTML = `
                    <a href="login.html" class="text-gray-600 font-medium hover:text-indigo-600">Login</a>
                    <a href="login.html?form=signup" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700">Sign Up</a>`;
            }
        }

        async function loadProfile(userId) {
            try {
                const userDoc = await getDoc(doc(db, "users", userId));
                if (!userDoc.exists()) {
                    ui.profileContainer.innerHTML = `<p class="text-center text-red-500">Profile not found.</p>`;
                    return;
                }
                const userData = userDoc.data();
                
                // Fetch reviews for this user
                const reviewTargetField = userData.userType === 'owner' ? 'ownerId' : 'renterId';
                const q = query(collection(db, "reviews"), where(reviewTargetField, "==", userId));
                const reviewsSnapshot = await getDocs(q);
                const reviews = reviewsSnapshot.docs.map(doc => doc.data());
                
                renderProfile(userData, reviews);

            } catch (error) {
                console.error("Error loading profile:", error);
                ui.loader.textContent = 'Failed to load profile.';
            }
        }

        function renderProfile(user, reviews) {
            let totalRating = 0;
            reviews.forEach(review => totalRating += review.rating);
            const averageRating = reviews.length > 0 ? (totalRating / reviews.length).toFixed(1) : 0;
            const behaviorScore = (averageRating / 5) * 100;

            const circumference = 2 * Math.PI * 54; // 2 * pi * radius
            const strokeDashoffset = circumference - (behaviorScore / 100) * circumference;

            const reviewsHTML = reviews.length > 0 ? reviews.map(review => `
                <div class="border-t py-4">
                    <div class="flex items-center mb-2">
                        <div class="flex text-yellow-400">
                            ${[...Array(5)].map((_, i) => `<i class="fas fa-star ${i < review.rating ? '' : 'text-gray-300'}"></i>`).join('')}
                        </div>
                        <p class="ml-auto text-sm text-gray-500">by ${review.renterName || review.ownerName || 'Anonymous'}</p>
                    </div>
                    <p class="text-gray-600">${review.comment || 'No comment provided.'}</p>
                </div>
            `).join('') : '<p class="text-gray-500">No reviews yet.</p>';

            ui.profileContainer.innerHTML = `
                <div class="bg-white p-8 rounded-lg shadow-md">
                    <div class="flex flex-col md:flex-row items-center gap-8">
                        <!-- Behavior Score -->
                        <div class="relative w-40 h-40">
                             <svg class="w-full h-full score-circle" viewBox="0 0 120 120">
                                <circle class="text-gray-200" stroke-width="12" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60"/>
                                <circle class="text-indigo-600" stroke-width="12" stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}"
                                    stroke-linecap="round" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60"/>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-3xl font-bold">${averageRating}</span>
                                <span class="text-sm text-gray-500">/ 5</span>
                            </div>
                        </div>
                        
                        <!-- User Info -->
                        <div>
                            <img src="https://placehold.co/100x100/E2E8F0/4A5568?text=${(user.username || 'U').charAt(0).toUpperCase()}" class="w-24 h-24 rounded-full mb-4">
                            <h1 class="text-3xl font-bold">${user.username || 'User'}</h1>
                            <p class="text-gray-500 capitalize">${user.userType}</p>
                        </div>
                    </div>

                    <!-- About Section -->
                    <div class="mt-8 border-t pt-6">
                        <h2 class="text-2xl font-bold mb-2">About</h2>
                        <p class="text-gray-700">${user.about || 'This user has not provided a description yet.'}</p>
                    </div>

                     <!-- Reviews Section -->
                    <div class="mt-8 border-t pt-6">
                        <h2 class="text-2xl font-bold mb-4">Reviews (${reviews.length})</h2>
                        <div class="space-y-4">
                           ${reviewsHTML}
                        </div>
                    </div>
                </div>
            `;
        }

    </script>
    <!-- Font Awesome for stars -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</body>
</html>
