<!-- Renter Side  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
        }
        .gallery-thumbnail.active {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px #4f46e5;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-8">
                    <a href="renter-dashboard.html" class="text-2xl font-bold text-gray-900">RoomDekho</a>
                </div>
                <div class="flex items-center space-x-4">
                     <div class="relative">
                        <div id="userMenuBtn" class="flex items-center space-x-2 cursor-pointer">
                            <img id="userAvatar" class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/E2E8F0/4A5568?text=U" alt="User Avatar">
                            <span id="userName" class="hidden md:block font-semibold text-gray-700">User</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-500"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                         <div id="userMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu">
                             <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Your Profile</a>
                             <button id="logoutBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Logout</button>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 lg:px-8 py-8">
        <div id="detailsContainer">
            <p id="loader" class="text-center text-gray-500 py-20">Loading room details...</p>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="bookingModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop bg-black bg-opacity-50 hidden">
        <div class="bg-white w-full max-w-md rounded-lg shadow-xl">
            <div class="p-6 text-center">
                <h3 class="text-xl font-bold text-gray-900">Confirm Booking Request</h3>
                <p class="mt-2 text-gray-600">Are you sure you want to send a booking request for this room? The owner will be notified.</p>
                <div class="mt-6 flex justify-center gap-4">
                    <button id="cancelBookingBtn" class="px-6 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold hover:bg-gray-300">Cancel</button>
                    <button id="confirmBookingBtn" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700">Send Request</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ui = {
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            logoutBtn: document.getElementById('logoutBtn'),
            userMenuBtn: document.getElementById('userMenuBtn'),
            userMenu: document.getElementById('userMenu'),
            detailsContainer: document.getElementById('detailsContainer'),
            loader: document.getElementById('loader'),
            bookingModal: document.getElementById('bookingModal'),
            cancelBookingBtn: document.getElementById('cancelBookingBtn'),
            confirmBookingBtn: document.getElementById('confirmBookingBtn'),
        };

        let currentUser = null;
        let currentRoomId = null;
        let currentRoomData = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) renderUserInfo(userDoc.data());

                currentRoomId = new URLSearchParams(window.location.search).get('id');
                if (currentRoomId) {
                    await loadRoomDetails(currentRoomId);
                } else {
                    ui.detailsContainer.innerHTML = `<p class="text-center text-red-500">No room ID provided.</p>`;
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function renderUserInfo(userData) {
            ui.userName.textContent = userData.username || currentUser.email;
            if (userData.username) {
                ui.userAvatar.src = `https://placehold.co/40x40/E2E8F0/4A5568?text=${userData.username.charAt(0).toUpperCase()}`;
            }
        }

        async function loadRoomDetails(roomId) {
            try {
                const roomSnap = await getDoc(doc(db, "rooms", roomId));
                if (roomSnap.exists()) {
                    currentRoomData = roomSnap.data();
                    renderRoomDetails(currentRoomData);
                } else {
                    ui.detailsContainer.innerHTML = `<p class="text-center text-red-500">Room not found.</p>`;
                }
            } catch (error) {
                console.error("Error loading room details:", error);
                ui.detailsContainer.innerHTML = `<p class="text-center text-red-500">Failed to load details.</p>`;
            } finally {
                ui.loader.style.display = 'none';
            }
        }

        function renderRoomDetails(room) {
            const amenities = room.tags || [];
            const amenitiesHTML = amenities.map(tag => `
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-100 p-2 rounded-full">
                        <svg class="h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <span class="text-gray-700">${tag}</span>
                </div>
            `).join('');

            ui.detailsContainer.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h1 class="text-3xl md:text-4xl font-bold">${room.title || 'No Title'}</h1>
                        <p class="text-gray-500 mt-2 text-lg">${room.location || 'No Location'}</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2">
                             <img id="mainImage" src="${room.imageUrl || 'https://placehold.co/1200x800/E2E8F0/4A5568?text=Room+Image'}" alt="${room.title}" class="w-full h-96 object-cover rounded-xl shadow-lg">
                        </div>
                        <div class="lg:col-span-1">
                             <div class="bg-white p-6 rounded-lg shadow-md lg:sticky lg:top-28">
                                <p class="text-3xl font-bold">₹${(room.price || 0).toLocaleString()}<span class="text-lg font-normal text-gray-500">/month</span></p>
                                <div class="mt-6 border-t pt-6">
                                    <h3 class="font-bold text-lg mb-2">Owner Information</h3>
                                    <div class="flex items-center space-x-4">
                                         <img src="https://placehold.co/60x60/E2E8F0/4A5568?text=${(room.ownerName || 'O').charAt(0)}" class="w-14 h-14 rounded-full">
                                        <div>
                                            <p class="font-semibold text-lg">${room.ownerName || 'Owner'}</p>
                                        </div>
                                    </div>
                                </div>
                                <button id="bookingBtn" class="mt-6 block w-full bg-indigo-600 text-white text-center font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Send Booking Request</button>
                            </div>
                        </div>
                    </div>
                     <div class="bg-white p-6 rounded-lg shadow-md mt-8">
                        <h2 class="text-2xl font-bold mb-4">About this property</h2>
                        <p class="text-gray-700 leading-relaxed">${room.description || 'No description available.'}</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md mt-8">
                        <h2 class="text-2xl font-bold mb-4">Amenities</h2>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            ${amenitiesHTML || '<p>No amenities listed.</p>'}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('bookingBtn').addEventListener('click', openBookingModal);
        }

        function openBookingModal() {
            ui.bookingModal.classList.remove('hidden');
        }

        function closeBookingModal() {
            ui.bookingModal.classList.add('hidden');
        }

        async function sendBookingRequest() {
            ui.confirmBookingBtn.disabled = true;
            ui.confirmBookingBtn.textContent = 'Sending...';

            try {
                await addDoc(collection(db, 'bookings'), {
                    roomId: currentRoomId,
                    renterId: currentUser.uid,
                    ownerId: currentRoomData.ownerId,
                    status: 'pending',
                    createdAt: serverTimestamp(),
                    roomTitle: currentRoomData.title,
                    renterName: (await getDoc(doc(db, 'users', currentUser.uid))).data().username,
                });
                alert('Booking request sent successfully!');
                closeBookingModal();
                 document.getElementById('bookingBtn').textContent = 'Request Sent!';
                 document.getElementById('bookingBtn').disabled = true;
            } catch (error) {
                console.error('Error sending booking request:', error);
                alert('Failed to send booking request. Please try again.');
            } finally {
                ui.confirmBookingBtn.disabled = false;
                ui.confirmBookingBtn.textContent = 'Send Request';
            }
        }
        
        // --- Event Listeners ---
        ui.logoutBtn.addEventListener('click', () => signOut(auth));
        ui.userMenuBtn.addEventListener('click', () => ui.userMenu.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (ui.userMenu && !ui.userMenu.contains(e.target) && !ui.userMenuBtn.contains(e.target)) {
                ui.userMenu.classList.add('hidden');
            }
        });
        ui.cancelBookingBtn.addEventListener('click', closeBookingModal);
        ui.confirmBookingBtn.addEventListener('click', sendBookingRequest);

    </script>

</body>
</html>
