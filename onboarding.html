<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome! Let's Get Started</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-card {
            transition: all 0.2s ease-in-out;
        }
        .option-card.selected {
            border-color: #4f46e5; /* indigo-600 */
            background-color: #eef2ff; /* indigo-50 */
            box-shadow: 0 0 0 2px #4f46e5;
        }
        /* Hide number input spinners */
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type='number'] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="p-6 md:p-8">
            <!-- Progress Bar -->
            <div id="progress-container" class="mb-6 h-2 w-full bg-gray-200 rounded-full hidden">
                <div id="progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300"></div>
            </div>

            <!-- Onboarding Content Area -->
            <div id="onboarding-content">
                <!-- Content will be injected by JavaScript -->
            </div>

            <!-- Navigation Buttons -->
            <div id="navigation-container" class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-between sm:items-center gap-4 hidden">
                <button id="back-btn" class="w-full sm:w-auto text-gray-700 font-semibold py-3 px-6 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transition-colors duration-300">
                    Back
                </button>
                <button id="next-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-300 disabled:bg-indigo-300 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // =================================================================================
        // Firebase and App Configuration
        // =================================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
            measurementId: "G-E6RYJP6EKQ"
        };
        
        // =================================================================================
        // App Initialization
        // =================================================================================
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // =================================================================================
        // Onboarding Questions Data
        // =================================================================================
        const onboardingData = {
            renter: [
                { id: 'roomSize', question: 'What room size are you looking for?', type: 'options', options: ['1 RK', '1 BHK', '2 BHK', '3 BHK', '4+ BHK'] },
                { id: 'priceRange', question: 'What is your monthly price range?', type: 'range', fields: [{ id: 'min', label: 'Min Price', placeholder: 'e.g., 5000' }, { id: 'max', label: 'Max Price', placeholder: 'e.g., 15000' }] },
                { id: 'locality', question: 'Which locality or area do you prefer?', type: 'text', placeholder: 'e.g., Koramangala, Bengaluru' },
                { id: 'nearby', question: 'What facilities do you want nearby?', type: 'multiselect', options: ['Park', 'Temple', 'Market', 'Gym', 'Hospital', 'Metro'] },
                { id: 'sharing', question: 'How many partners will be sharing the space?', type: 'options', options: ['None', '1', '2', '3+'] },
                { id: 'maritalStatus', question: 'What is your marital status?', type: 'options', options: ['Single', 'Married', 'Prefer not to say'] },
                { id: 'profession', question: 'What is your profession?', type: 'options', options: ['Student', 'Working Professional', 'Business', 'Other'] },
                { id: 'age', question: 'What is your age?', type: 'number', placeholder: 'e.g., 25' },
            ],
            owner: [
                { id: 'renterType', question: 'What type of renter do you prefer?', type: 'multiselect', options: ['Students', 'Working Professionals', 'Family'] },
                { id: 'maritalStatus', question: 'What marital status do you prefer for renters?', type: 'options', options: ['Married', 'Unmarried', 'Any'] },
                { id: 'memberCount', question: 'How many members are allowed?', type: 'number', placeholder: 'e.g., 3' },
                { id: 'ageRange', question: 'What is the preferred age range for renters?', type: 'range', fields: [{ id: 'min', label: 'Min Age', placeholder: 'e.g., 21' }, { id: 'max', label: 'Max Age', placeholder: 'e.g., 45' }] },
                { id: 'bills', question: 'Who will pay for electricity and water bills?', type: 'options', options: ['Renter Pays', 'Owner Pays', 'Included in rent'] },
                { id: 'parking', question: 'Is parking available for the renter?', type: 'options', options: ['Yes, Car & Bike', 'Yes, Bike only', 'No'] },
            ]
        };
        
        // =================================================================================
        // DOM Element References
        // =================================================================================
        const DOMElements = {
            contentContainer: document.getElementById('onboarding-content'),
            progressContainer: document.getElementById('progress-container'),
            progressBar: document.getElementById('progress-bar'),
            navContainer: document.getElementById('navigation-container'),
            nextBtn: document.getElementById('next-btn'),
            backBtn: document.getElementById('back-btn'),
        };

        // =================================================================================
        // Application State
        // =================================================================================
        const AppState = {
            currentUser: null,
            currentRole: null,
            currentStep: -1, // -1 indicates the role selection screen
            formData: {},
        };

        // =================================================================================
        // Main App Logic Object
        // =================================================================================
        const App = {
            /**
             * Initializes the application.
             */
            init() {
                this.setupEventListeners();
                onAuthStateChanged(auth, this.handleAuthStateChange.bind(this));
            },

            /**
             * Handles user login status changes.
             */
            handleAuthStateChange(user) {
                if (user) {
                    AppState.currentUser = user;
                    this.renderStep(); // Start the onboarding flow
                } else {
                    console.log("No user signed in. Redirecting to login.");
                    window.location.href = 'login.html';
                }
            },

            /**
             * Sets up all event listeners for the page.
             */
            setupEventListeners() {
                DOMElements.nextBtn.addEventListener('click', this.handleNextClick.bind(this));
                DOMElements.backBtn.addEventListener('click', this.handleBackClick.bind(this));
            },
            
            // --- UI Rendering Functions ---

            /**
             * Main function to render the current step of the onboarding process.
             */
            renderStep() {
                DOMElements.contentContainer.innerHTML = '';
                if (AppState.currentRole === null) {
                    this.renderRoleSelection();
                } else if (AppState.currentStep < onboardingData[AppState.currentRole].length) {
                    this.renderQuestion();
                } else {
                    this.renderCompletionSummary(); // Show summary before finish
                }
                this.updateNavigation();
            },

            /**
             * Renders the initial screen for the user to select their role (Renter or Owner).
             */
            renderRoleSelection() {
                DOMElements.progressContainer.classList.add('hidden');
                DOMElements.navContainer.classList.add('hidden');
                DOMElements.contentContainer.innerHTML = `
                    <div class="text-center fade-in">
                        <h1 class="text-3xl font-bold text-gray-900">Welcome!</h1>
                        <p class="mt-2 text-gray-600">To get started, please tell us who you are.</p>
                        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div id="select-renter" class="role-card p-6 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-all">
                                <svg class="w-12 h-12 mx-auto text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                <h2 class="mt-4 text-xl font-semibold text-gray-800">Renter</h2>
                                <p class="mt-1 text-sm text-gray-500">I'm looking for a place to rent.</p>
                            </div>
                            <div id="select-owner" class="role-card p-6 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-all">
                                <svg class="w-12 h-12 mx-auto text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                                <h2 class="mt-4 text-xl font-semibold text-gray-800">Owner</h2>
                                <p class="mt-1 text-sm text-gray-500">I want to list my property.</p>
                            </div>
                        </div>
                    </div>`;
                
                // FIXED: Add event listeners after rendering
                document.getElementById('select-renter').addEventListener('click', () => this.selectRole('renter'));
                document.getElementById('select-owner').addEventListener('click', () => this.selectRole('owner'));
            },

            /**
             * Renders the current question based on the user's role and step.
             */
            renderQuestion() {
                DOMElements.progressContainer.classList.remove('hidden');
                DOMElements.navContainer.classList.remove('hidden');
                const stepData = onboardingData[AppState.currentRole][AppState.currentStep];
                let inputHTML = '';

                switch (stepData.type) {
                    case 'options':
                        inputHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">` +
                            stepData.options.map(option => `<div class="option-card p-4 border rounded-lg cursor-pointer text-center font-medium" data-id="${stepData.id}" data-value="${option}">${option}</div>`).join('') + `</div>`;
                        break;
                    case 'multiselect':
                        inputHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">` +
                            stepData.options.map(option => `<div class="option-card p-4 border rounded-lg cursor-pointer text-center font-medium" data-id="${stepData.id}" data-value="${option}">${option}</div>`).join('') + `</div>`;
                        break;
                    case 'range':
                        inputHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">` +
                            stepData.fields.map(field => `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">${field.label}</label>
                                    <input type="number" id="${stepData.id}-${field.id}" placeholder="${field.placeholder}" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                                </div>
                            `).join('') + `</div>`;
                        break;
                    default:
                        inputHTML = `<div class="mt-4">
                            <input type="${stepData.type}" id="${stepData.id}" placeholder="${stepData.placeholder}" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                        </div>`;
                        break;
                }

                DOMElements.contentContainer.innerHTML = `
                    <div class="fade-in">
                        <h2 class="text-2xl font-bold text-gray-800">${stepData.question}</h2>
                        <p class="text-gray-500 mt-1">Step ${AppState.currentStep + 1} of ${onboardingData[AppState.currentRole].length}</p>
                        ${inputHTML}
                    </div>`;
                
                this.setupQuestionListeners();
                this.restoreFormState();
                this.validateForm();
            },
            
            /**
             * Renders a summary screen after all questions are answered.
             */
            renderCompletionSummary() {
                DOMElements.progressContainer.classList.add('hidden');
                DOMElements.navContainer.classList.add('hidden');
                
                const summary = Object.entries(AppState.formData).map(([key, value]) => {
                    let displayValue;
                    if (Array.isArray(value)) {
                        displayValue = value.join(', ');
                    } else if (typeof value === 'object' && value !== null) {
                        displayValue = `${value.min || 'N/A'} - ${value.max || 'N/A'}`;
                    } else {
                        displayValue = value;
                    }
                    const formattedKey = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    return `<li class="truncate"><strong class="font-semibold">${formattedKey}:</strong> ${displayValue}</li>`;
                }).join('');

                DOMElements.contentContainer.innerHTML = `
                    <div class="text-center fade-in">
                        <svg class="w-16 h-16 mx-auto text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <h1 class="text-3xl font-bold text-gray-900 mt-4">You're All Set!</h1>
                        <p class="mt-2 text-gray-600">Thank you for providing your preferences.</p>
                        <div class="mt-6 text-left bg-gray-50 p-4 rounded-lg max-h-48 overflow-y-auto">
                            <h3 class="font-semibold mb-2">Your Preferences:</h3>
                            <ul class="space-y-1 text-sm text-gray-700 list-disc list-inside">${summary}</ul>
                        </div>
                        <button id="finish-btn" class="mt-8 w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-indigo-700">Go to Dashboard</button>
                    </div>`;
                
                document.getElementById('finish-btn').addEventListener('click', this.saveOnboardingData.bind(this));
            },

            // --- Event Handlers & Logic ---

            handleNextClick() {
                this.saveFormState();
                const totalSteps = onboardingData[AppState.currentRole].length;
                if (AppState.currentStep < totalSteps - 1) {
                    AppState.currentStep++;
                    this.renderStep();
                } else {
                    this.renderCompletionSummary();
                }
            },

            handleBackClick() {
                this.saveFormState(); // Save state even when going back
                if (AppState.currentStep > 0) {
                    AppState.currentStep--;
                    this.renderStep();
                } else {
                    AppState.currentRole = null;
                    AppState.currentStep = -1;
                    this.renderStep();
                }
            },
            
            selectRole(role) {
                AppState.currentRole = role;
                AppState.currentStep = 0;
                this.renderStep();
            },

            /**
             * Saves the final onboarding data to Firestore and redirects the user.
             */
            async saveOnboardingData() {
                const finishBtn = document.getElementById('finish-btn');
                finishBtn.disabled = true;
                finishBtn.textContent = 'Saving...';

                try {
                    const userRef = doc(db, "users", AppState.currentUser.uid);
                    await updateDoc(userRef, {
                        onboardingComplete: true,
                        userType: AppState.currentRole,
                        preferences: { ...AppState.formData } // Save as 'preferences'
                    }, { merge: true }); // Use merge:true to not overwrite existing user data

                    // alert("Onboarding complete! Redirecting...");
                    window.location.href = AppState.currentRole === "owner" ? 'owner-dashboard.html' : 'renter-dashboard.html';
                
                } catch (error) {
                    console.error("Error saving data: ", error);
                    alert("Failed to save your preferences. Please try again.");
                    finishBtn.disabled = false;
                    finishBtn.textContent = 'Go to Dashboard';
                }
            },
            
            // --- Form State Management ---
            
            // FIXED: Add event listeners to dynamically created elements
            setupQuestionListeners() {
                 document.querySelectorAll('.option-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        const { id, value } = e.currentTarget.dataset;
                        const stepData = onboardingData[AppState.currentRole][AppState.currentStep];
                        if (stepData.type === 'multiselect') {
                            this.handleMultiSelect(e.currentTarget, id, value);
                        } else {
                            this.handleOptionSelect(e.currentTarget, id, value);
                        }
                    });
                });
                document.querySelectorAll('input').forEach(input => input.addEventListener('input', this.validateForm.bind(this)));
            },

            handleOptionSelect(element, id, value) {
                document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.remove('selected'));
                element.classList.add('selected');
                AppState.formData[id] = value;
                this.validateForm();
            },

            handleMultiSelect(element, id, value) {
                element.classList.toggle('selected');
                if (!AppState.formData[id] || !Array.isArray(AppState.formData[id])) AppState.formData[id] = [];
                
                if (AppState.formData[id].includes(value)) {
                    AppState.formData[id] = AppState.formData[id].filter(item => item !== value);
                } else {
                    AppState.formData[id].push(value);
                }
                if (AppState.formData[id].length === 0) delete AppState.formData[id];
                this.validateForm();
            },
            
            // FIXED: Correctly save data from different input types
            saveFormState() {
                 if (!AppState.currentRole || AppState.currentStep < 0 || AppState.currentStep >= onboardingData[AppState.currentRole].length) return;
                 const stepData = onboardingData[AppState.currentRole][AppState.currentStep];
                
                switch(stepData.type) {
                    case 'text': case 'number':
                        const inputEl = document.getElementById(stepData.id);
                        if(inputEl) AppState.formData[stepData.id] = inputEl.value;
                        break;
                    case 'range':
                        const minInput = document.getElementById(`${stepData.id}-min`);
                        const maxInput = document.getElementById(`${stepData.id}-max`);
                        if (minInput && maxInput) {
                            AppState.formData[stepData.id] = { min: minInput.value, max: maxInput.value };
                        }
                        break;
                }
            },

            // FIXED: Correctly restore data for all input types
            restoreFormState() {
                if (!AppState.currentRole || AppState.currentStep < 0) return;
                const stepData = onboardingData[AppState.currentRole][AppState.currentStep];
                const value = AppState.formData[stepData.id];
                if (value === undefined) return;

                switch(stepData.type) {
                    case 'options':
                        document.querySelectorAll(`[data-id="${stepData.id}"]`).forEach(el => {
                            if (el.dataset.value === value) el.classList.add('selected');
                        });
                        break;
                    case 'multiselect':
                        document.querySelectorAll(`[data-id="${stepData.id}"]`).forEach(el => {
                            if (Array.isArray(value) && value.includes(el.dataset.value)) el.classList.add('selected');
                        });
                        break;
                    case 'text': case 'number':
                        const inputEl = document.getElementById(stepData.id);
                        if (inputEl) inputEl.value = value;
                        break;
                    case 'range':
                        if (typeof value === 'object') {
                            const minInput = document.getElementById(`${stepData.id}-min`);
                            const maxInput = document.getElementById(`${stepData.id}-max`);
                            if(minInput) minInput.value = value.min || '';
                            if(maxInput) maxInput.value = value.max || '';
                        }
                        break;
                }
            },

            // FIXED: Correctly validate all input types
            validateForm() {
                if (!AppState.currentRole || AppState.currentStep < 0) {
                    DOMElements.nextBtn.disabled = true; return;
                }
                const stepData = onboardingData[AppState.currentRole][AppState.currentStep];
                let isValid = false;
                
                switch (stepData.type) {
                    case 'options': isValid = !!AppState.formData[stepData.id]; break;
                    case 'multiselect': isValid = AppState.formData[stepData.id] && AppState.formData[stepData.id].length > 0; break;
                    case 'text': case 'number':
                        const input = document.getElementById(stepData.id);
                        isValid = input && input.value.trim() !== '';
                        break;
                    case 'range':
                        const minInput = document.getElementById(`${stepData.id}-min`);
                        const maxInput = document.getElementById(`${stepData.id}-max`);
                        isValid = minInput && maxInput && minInput.value.trim() !== '' && maxInput.value.trim() !== '' && !isNaN(parseFloat(minInput.value)) && !isNaN(parseFloat(maxInput.value));
                        break;
                }
                DOMElements.nextBtn.disabled = !isValid;
            },
            
            updateNavigation() {
                if (AppState.currentRole === null) return;
                const totalSteps = onboardingData[AppState.currentRole].length;
                const progress = totalSteps > 0 ? ((AppState.currentStep + 1) / totalSteps) * 100 : 0;
                DOMElements.progressBar.style.width = `${progress}%`;
                DOMElements.nextBtn.textContent = (AppState.currentStep === totalSteps - 1) ? 'Finish' : 'Next';
            }
        };

        // --- Start the App ---
        App.init();

    </script>
</body>
</html>
