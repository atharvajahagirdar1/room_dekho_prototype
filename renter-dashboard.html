<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renter Dashboard - RoomDekho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        .text-primary { color: #4F46E5; }
        .bg-primary { background-color: #4F46E5; }
        .hover\:bg-primary-dark:hover { background-color: #4338CA; }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.07); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
        }
        .filter-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        
        /* FIXED: Replaced @apply with standard CSS */
        .form-checkbox {
            width: 1rem;
            height: 1rem;
            color: #4f46e5; 
            background-color: #f3f4f6; 
            border-color: #d1d5db;
            border-radius: 0.25rem;
        }
        .form-checkbox:focus {
             --tw-ring-offset-shadow: 0 0 #0000;
             --tw-ring-shadow: 0 0 #0000;
             box-shadow: 0 0 #0000;
             border-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-3xl font-bold text-indigo-600">RoomDekho</a>
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium">Browse Rooms</a>
                        <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">PG/Hostels</a>
                        <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">Shared Spaces</a>
                    </nav>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="hidden sm:flex items-center">
                        <i class="fas fa-map-marker-alt text-gray-500 mr-2"></i>
                        <!-- UPDATED: Added ID to this span -->
                        <span id="userLocation" class="text-gray-700 font-medium">Loading...</span>
                    </div>
                     <div class="relative">
                        <div id="userMenuBtn" class="flex items-center space-x-2 cursor-pointer">
                            <img id="userAvatar" class="h-9 w-9 rounded-full object-cover" src="https://placehold.co/100x100/E2E8F0/4A5568?text=U" alt="User avatar">
                            <span id="userName" class="hidden md:block text-gray-700 font-medium">User</span>
                            <i class="fas fa-chevron-down text-gray-500 text-xs"></i>
                        </div>
                         <div id="userMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu">
                             <a href="my-bookings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">My Bookings</a>
                             <a href="#" id="profileLink" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">My Profile</a>
                             <button id="logoutBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Logout</button>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 sm:px-6 lg:px-8">
        <!-- Search and Filters -->
        <div class="px-4 sm:px-0">
            <h2 class="text-3xl font-bold text-gray-900">Find Your Perfect Room</h2>
            <p class="mt-1 text-gray-600">Discover Comfortable and Affordable Rooms across India</p>

            <div class="mt-6 flex flex-col md:flex-row gap-2">
                <div class="relative flex-grow">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                    <input id="searchInput" type="text" placeholder="Search by city, locality, or landmark (e.g., MG Road, Pune)" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button id="nearMeBtn" class="flex items-center justify-center bg-blue-100 text-blue-700 font-semibold px-4 py-3 rounded-lg hover:bg-blue-200">
                    <i class="fas fa-location-arrow w-5 h-5 mr-2"></i>
                    Near Me
                </button>
                <button class="bg-indigo-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-indigo-700">
                    Filters
                </button>
            </div>
            
            <div id="filters" class="mt-4 flex items-center gap-2 overflow-x-auto pb-2">
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="1BHK">1BHK</button>
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="2BHK">2BHK</button>
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="PG">PG</button>
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="Hostel">Hostel</button>
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="Furnished">Furnished</button>
                <button class="filter-btn whitespace-nowrap px-4 py-2 border rounded-full text-sm font-medium" data-filter="Wi-Fi">Wi-Fi</button>
            </div>
        </div>
        
        <!-- Recommendation Banner -->
        <div id="recommendation-banner" class="mt-6 mb-8 bg-indigo-50 border border-indigo-200 rounded-lg p-3 flex items-center justify-between hidden">
            <p class="text-sm text-indigo-800"><span class="font-semibold">Because you're a Student</span> → PG & Hostel rooms shown first</p>
            <button onclick="document.getElementById('recommendation-banner').style.display='none'" class="text-indigo-800 hover:bg-indigo-100 rounded-full p-1">
                <i class="fas fa-times w-4 h-4"></i>
            </button>
        </div>

        <!-- Property Listings -->
        <div class="mt-8 px-4 sm:px-0">
             <div class="flex justify-between items-center mb-4">
                 <h3 class="text-xl font-bold text-gray-900">Available Rooms <span id="roomCount" class="text-gray-500 font-medium">(...)</span></h3>
                 <div class="flex items-center space-x-4">
                    <button id="savedToggleBtn" class="flex items-center text-gray-700 font-medium">
                        <i class="fas fa-heart mr-2"></i>
                        Saved (<span id="savedCount">0</span>)
                    </button>
                    <button class="flex items-center text-gray-700 font-medium">
                        <i class="fas fa-map-marker-alt mr-2"></i>
                        Map View
                    </button>
                 </div>
             </div>

            <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic Content Here -->
            </div>

            <div id="loadMoreContainer" class="mt-8 text-center">
                 <button id="loadMoreBtn" class="bg-white text-gray-800 font-semibold px-6 py-3 rounded-lg border border-gray-300 hover:bg-gray-100">Load More Rooms</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where, updateDoc, arrayUnion, arrayRemove, limit, startAfter } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyQlPonxZFcMJ2DG7Gh3TpizWbpKhN9nI",
            authDomain: "room-dekho-ecf17.firebaseapp.com",
            projectId: "room-dekho-ecf17",
            storageBucket: "room-dekho-ecf17.appspot.com",
            messagingSenderId: "171669282445",
            appId: "1:171669282445:web:4ae6f044a49bdbe3ba4cc4",
        };
        
        const ROOMS_PER_PAGE = 6;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ui = {
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            logoutBtn: document.getElementById('logoutBtn'),
            userMenuBtn: document.getElementById('userMenuBtn'),
            userMenu: document.getElementById('userMenu'),
            profileLink: document.getElementById('profileLink'),
            listingsGrid: document.getElementById('listingsGrid'),
            roomCount: document.getElementById('roomCount'),
            searchInput: document.getElementById('searchInput'),
            filters: document.getElementById('filters'),
            savedToggleBtn: document.getElementById('savedToggleBtn'),
            savedCount: document.getElementById('savedCount'),
            loadMoreBtn: document.getElementById('loadMoreBtn'),
            loadMoreContainer: document.getElementById('loadMoreContainer'),
            recommendationBanner: document.getElementById('recommendation-banner'),
            nearMeBtn: document.getElementById('nearMeBtn'), 
            userLocation: document.getElementById('userLocation'), // <-- ADDED
        };

        const state = {
            currentUser: null,
            userData: {},
            allRooms: [],
            savedRoomIds: [],
            showingSaved: false,
            lastVisible: null,
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    state.userData = userDoc.data();
                    if (state.userData.userType === 'renter') {
                        renderUserInfo(); // This now updates location
                        state.savedRoomIds = state.userData.savedRooms || [];
                        updateSavedCount();
                        showRecommendationBanner();
                        await fetchRooms(true);
                        bindEvents();
                    } else {
                        window.location.href = 'owner-dashboard.html';
                    }
                } else {
                    window.location.href = 'onboarding.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        function bindEvents() {
            ui.logoutBtn.addEventListener('click', () => signOut(auth));
            ui.userMenuBtn.addEventListener('click', () => ui.userMenu.classList.toggle('hidden'));
            
            document.addEventListener('click', (e) => {
                if (ui.userMenu && !ui.userMenu.contains(e.target) && !ui.userMenuBtn.contains(e.target)) {
                    ui.userMenu.classList.add('hidden');
                }
            });

            ui.searchInput.addEventListener('input', applyFilters);
            ui.filters.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    e.target.classList.toggle('active');
                    applyFilters();
                }
            });
            
            ui.listingsGrid.addEventListener('click', (e) => {
                const saveBtn = e.target.closest('.save-btn');
                if (saveBtn) {
                    e.preventDefault(); 
                    toggleSaveProperty(saveBtn.dataset.id);
                }
            });

            ui.savedToggleBtn.addEventListener('click', () => {
                state.showingSaved = !state.showingSaved;
                ui.savedToggleBtn.classList.toggle('text-indigo-600', state.showingSaved);
                ui.savedToggleBtn.classList.toggle('font-bold', state.showingSaved);
                applyFilters();
            });

            ui.loadMoreBtn.addEventListener('click', () => fetchRooms(false));
            
            ui.nearMeBtn.addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition, showError);
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            });
        }
        
        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            alert(`Location found! Latitude: ${lat}, Longitude: ${lon}. We can now filter rooms based on this.`);
            // You could also try to reverse-geocode here to get a city name
            // For now, let's update the header to show coordinates
            ui.userLocation.textContent = `Your Location`;
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    alert("User denied the request for Geolocation.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Location information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user location timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }
        
        // --- UPDATED RENDERUSERINFO ---
        function renderUserInfo() {
            ui.userName.textContent = state.userData.username || state.currentUser.email;
            if (state.userData.username) {
                ui.userAvatar.src = `https://placehold.co/100x100/E2E8F0/4A5568?text=${state.userData.username.charAt(0).toUpperCase()}`;
            }
            ui.profileLink.href = `profile.html?id=${state.currentUser.uid}`;
            
            // --- NEW LOGIC ---
            // Try to get location from onboarding preferences
            const prefs = state.userData.preferences || {};
            if (prefs.locality) {
                ui.userLocation.textContent = prefs.locality;
            } else if (state.userData.city) { // Fallback to city from main user data
                 ui.userLocation.textContent = state.userData.city;
            } else {
                ui.userLocation.textContent = "India"; // Generic fallback
            }
        }
        
        function showRecommendationBanner() {
            const prefs = state.userData.preferences || {};
            if (prefs.profession === 'Student') {
                ui.recommendationBanner.classList.remove('hidden');
            }
        }

        async function fetchRooms(initial = false) {
            if (initial) {
                state.allRooms = [];
                state.lastVisible = null;
                ui.listingsGrid.innerHTML = '';
            }
            ui.loadMoreBtn.disabled = true;
            ui.loadMoreBtn.textContent = "Loading...";

            try {
                let q = query(collection(db, "rooms"), where("status", "==", "Available"), limit(ROOMS_PER_PAGE));
                if (state.lastVisible && !initial) {
                    q = query(q, startAfter(state.lastVisible));
                }
                
                const snapshot = await getDocs(q);
                
                if (!snapshot.empty) {
                    state.lastVisible = snapshot.docs[snapshot.docs.length - 1];
                    const newRooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    state.allRooms.push(...newRooms);
                    ui.loadMoreContainer.style.display = 'block';
                } else {
                    ui.loadMoreContainer.style.display = 'none';
                    if (initial) ui.roomCount.textContent = '(0 found)';
                }
                applyFilters(); 
            } catch (error) {
                console.error("Error fetching rooms:", error);
            } finally {
                ui.loadMoreBtn.disabled = false;
                ui.loadMoreBtn.textContent = "Load More Rooms";
            }
        }
        
        function renderRooms(rooms) {
            ui.listingsGrid.innerHTML = '';
            ui.roomCount.textContent = `(${rooms.length} found)`;
            
            if (rooms.length === 0) {
                ui.listingsGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No properties match your criteria.</p>`;
                return;
            }
            rooms.forEach(room => ui.listingsGrid.innerHTML += createRoomCardHTML(room));
        }

        function createRoomCardHTML(room) {
            const isSaved = state.savedRoomIds.includes(room.id);
            return `
                <div class="property-card bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="relative">
                        <a href="room-details.html?id=${room.id}" class="block">
                            <img src="${room.imageUrl || 'https://placehold.co/600x400/E2E8F0/4A5568?text=Room'}" alt="Room" class="w-full h-56 object-cover">
                        </a>
                        <div class="absolute top-2 right-2 bg-white p-1.5 rounded-full cursor-pointer save-btn" data-id="${room.id}">
                            <svg class="h-6 w-6 ${isSaved ? 'text-red-500' : 'text-gray-400'}" fill="${isSaved ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                        </div>
                        <div class="absolute bottom-2 left-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded-md">${room.imageUrls ? room.imageUrls.length : 1} photos</div>
                        <div class="absolute top-2 left-2 ${room.status === 'Booked' ? 'bg-orange-500' : 'bg-green-500'} text-white text-xs px-2 py-1 rounded-md font-semibold">${room.status || 'Available'}</div>
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start">
                             <div>
                                <h3 class="text-lg font-bold text-gray-900">${room.title || 'Spacious Room'}</h3>
                                <p class="text-sm text-gray-600">${room.location || 'Prime Location'}</p>
                             </div>
                             <div class="flex items-center">
                                 <i class="fas fa-star text-yellow-400"></i>
                                 <span class="ml-1 text-gray-800 font-bold">${room.rating || '4.5'}</span>
                                 <span class="ml-1 text-gray-500">(${room.reviewCount || 0})</span>
                             </div>
                        </div>
                        <p class="mt-2 text-2xl font-bold text-gray-900">₹${(room.price || 0).toLocaleString()} <span class="text-sm font-normal text-gray-500">/month</span></p>
                        <div class="mt-4 flex justify-between items-center">
                            <div class="flex items-center">
                                <img src="${room.ownerAvatar || 'https://placehold.co/100x100/E2E8F0/4A5568?text=O'}" class="h-8 w-8 rounded-full" />
                                <a href="profile.html?id=${room.ownerId}" class="ml-2 text-gray-700 font-medium hover:underline">${room.ownerName || 'Owner'}</a>
                            </div>
                            <a href="mailto:${room.ownerEmail || ''}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700">Contact Owner</a>
                        </div>
                    </div>
                </div>`;
        }
        
        function applyFilters() {
            let roomsToDisplay = state.allRooms;
            const searchTerm = ui.searchInput.value.toLowerCase();
            const activeFilters = [...ui.filters.querySelectorAll('.filter-btn.active')].map(btn => btn.dataset.filter);
            
            const isFiltered = !!(searchTerm || activeFilters.length > 0 || state.showingSaved);

            if (state.showingSaved) {
                roomsToDisplay = roomsToDisplay.filter(room => state.savedRoomIds.includes(room.id));
            }
            if (searchTerm) {
                roomsToDisplay = roomsToDisplay.filter(room => (room.title && room.title.toLowerCase().includes(searchTerm)) || (room.location && room.location.toLowerCase().includes(searchTerm)));
            }
            if (activeFilters.length > 0) {
                 roomsToDisplay = roomsToDisplay.filter(room => {
                    const roomTags = [room.roomType, room.furnishing, ...(room.amenities || [])];
                    return activeFilters.every(filter => roomTags.includes(filter));
                 });
            }
            
            renderRooms(roomsToDisplay);
            ui.loadMoreContainer.style.display = isFiltered ? 'none' : 'block';
        }

        async function toggleSaveProperty(roomId) {
            const userDocRef = doc(db, "users", state.currentUser.uid);
            const isSaved = state.savedRoomIds.includes(roomId);
            try {
                if (isSaved) {
                    await updateDoc(userDocRef, { savedRooms: arrayRemove(roomId) });
                    state.savedRoomIds = state.savedRoomIds.filter(id => id !== roomId);
                } else {
                    await updateDoc(userDocRef, { savedRooms: arrayUnion(roomId) });
                    state.savedRoomIds.push(roomId);
                }
                updateSavedCount();
                applyFilters();
            } catch (error) {
                console.error("Error updating saved rooms:", error);
            }
        }

        function updateSavedCount() {
            ui.savedCount.textContent = state.savedRoomIds.length;
        }

    </script>
</body>
</html>
